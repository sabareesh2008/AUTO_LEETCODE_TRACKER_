name: Update LeetCode Leaderboard

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tracker.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: leetcode-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync students and update LeetCode stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tracker.py

      - name: Commit generated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students.csv Students.xlsx LiveData.csv History.csv DailyActivity.csv
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Auto update LeetCode leaderboard"
          git pull --rebase origin main
          git push origin main
